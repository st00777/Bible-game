<!doctype html><meta charset="utf-8"><title>rive browser test</title>
<style>body{margin:0;background:#fdf6ec}canvas{width:700px;height:1050px}</style>
<canvas id="c" width="700" height="1050"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.42.0/rive.js"></script>
<script>
const b64="__B64__";
const bin=Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0));
window.__ready=false;
const r=new rive.Rive({buffer:bin.buffer,canvas:document.getElementById('c'),stateMachines:'SM',autoplay:true,
  onLoad(){ window.__inputs=r.stateMachineInputs('SM'); window.__r=r; window.__ready=true; }});
window.fire=(name)=>{ const i=window.__inputs.find(x=>x.name===name); i.fire(); };
window.setNum=(name,v)=>{ const i=window.__inputs.find(x=>x.name===name); i.value=v; };
</script>
